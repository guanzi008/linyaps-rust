name: Release Debian packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  debian-packages:
    runs-on: ubuntu-24.04
    container: rust:1.92-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils dpkg-dev gh lintian musl-tools xz-utils
          rustup target add x86_64-unknown-linux-musl
      - name: Derive Debian version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            version=${version/-rust./~rust}
            echo "deb_version=${version}-1" >>"$GITHUB_OUTPUT"
          fi
      - name: Build Debian packages
        env:
          DEB_VERSION: ${{ steps.version.outputs.deb_version }}
        run: ./packaging/debian/build-debs.sh
      - name: Verify Debian packages
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(find dist -maxdepth 1 -name 'linglong-bin_*.deb' -print -quit)
          builder=$(find dist -maxdepth 1 -name 'linglong-builder_*.deb' -print -quit)
          for package in "$runtime" "$builder"; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package" >/dev/null
            lintian --fail-on error "$package"
          done
          runtime_root=$(mktemp -d)
          builder_root=$(mktemp -d)
          dpkg-deb --extract "$runtime" "$runtime_root"
          dpkg-deb --extract "$builder" "$builder_root"
          "$runtime_root/usr/bin/ll-cli" --version
          "$builder_root/usr/bin/ll-builder" --version
          init=$runtime_root/usr/libexec/linglong/ll-init
          if readelf -l "$init" | grep -q 'INTERP\|Requesting program interpreter'; then
            echo 'packaged ll-init has a dynamic interpreter' >&2
            exit 1
          fi
          if readelf -d "$init" 2>/dev/null | grep -q '(NEEDED)'; then
            echo 'packaged ll-init has dynamic dependencies' >&2
            exit 1
          fi
          test ! -e "$runtime_root/usr/bin/ll-box"
          sha256sum --check dist/SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linyaps-debian-${{ github.sha }}
          path: |
            dist/*.deb
            dist/SHA256SUMS
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "linyaps-rust ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
